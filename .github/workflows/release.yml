name: Release

# Disparado por push de tags v*.*.* (ej: v1.2.0).
# Hace build multi-arch (linux/amd64 + linux/arm64) y pushea a GHCR con tags:
#   - latest                    (sólo en tags de main)
#   - <version>                 (ej: 1.2.0)
#   - <major>                   (ej: 1)
#   - <major>.<minor>           (ej: 1.2)
#   - <sha>                     (ej: abc1234)
# Después crea un GitHub Release con notas auto-generadas.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Necesitamos write en packages y contents para crear el release.
permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/umbral
          # latest sólo se aplica al tag más reciente de la rama default.
          # En otros tags queda el versionado semver.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          flavor: latest=auto

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate notes
        id: notes
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # config-name default
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          # Si no hay .github/release-drafter.yml, usa defaults razonables
          # (agrupa por conventional commits, etc).
          publish: true
